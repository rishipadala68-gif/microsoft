[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-agent"
version = "0.1.0"
description = "Incident Response Agent with Brain-Inspired Memory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.31.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "psycopg[binary,pool]>=3.2.0",
    "pgvector>=0.3.0",
    "redis>=5.0.0",
    "anthropic>=0.34.0",
    "sentence-transformers>=3.1.0",
    "scikit-learn>=1.5.0",
    "slack-bolt>=1.20.0",
    "typer>=0.12.0",
    "rich>=13.8.0",
    "httpx>=0.27.0",
    "gitpython>=3.1.0",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "apscheduler>=3.10.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

